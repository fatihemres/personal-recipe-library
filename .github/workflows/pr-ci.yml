name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: python3 tools/check_app_version.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build

  rust-sqlite-catalog:
    name: Rust, SQLite and catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate catalog sources and reports
        run: |
          python3 tools/prepare_m3d2a_candidates.py --check
          python3 tools/prepare_m3d2b_catalog.py --check
          python3 tools/report_m3d2b_quality.py --check
          python3 tools/prepare_m3d3_candidates.py --check
          python3 tools/prepare_m3d3_catalog.py --check
          python3 tools/report_m3d3_quality.py --check
          python3 tools/fetch_m3d4_wikidata.py
          python3 tools/prepare_m3d4_candidates.py --check
          python3 tools/prepare_m3d4_catalog.py --check
          python3 tools/audit_catalog.py --check
          python3 tools/test_catalog_audit.py
          python3 tools/test_m3d1_catalog.py
          python3 tools/test_m3d2a_candidates.py
          python3 tools/test_m3d2b_catalog.py
          python3 tools/test_m3d3_catalog.py
          python3 tools/test_m3d4_catalog.py
      - name: Verify fresh and historical SQLite catalog imports
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example catalog_import
          python3 tools/report_m3d2b_coverage.py
          python3 tools/report_m3d4_coverage.py --check
          python3 tools/verify_catalog_installation.py --include-v9 --output "${RUNNER_TEMP}/catalog-installation.json"
          git diff --exit-code -- catalog/releases/8/m3d2b-sqlite-report.json docs/CATALOG_M3D2B_COVERAGE.md

  macos-arm64:
    name: macOS Apple Silicon package
    needs: [frontend, rust-sqlite-catalog]
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm run build
      - name: Rust and SQLite integration tests on macOS arm64
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg -- --locked
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify and archive packages
        run: |
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/recipe-library-macos-arm64.app.zip
          cp "$dmg" artifacts/
          (cd artifacts && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  macos-intel:
    name: macOS Intel package
    needs: [frontend, rust-sqlite-catalog]
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-apple-darwin
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm run build
      - name: Rust and SQLite integration tests on macOS Intel
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target x86_64-apple-darwin --bundles app,dmg -- --locked
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify and archive packages
        run: |
          bundle="src-tauri/target/x86_64-apple-darwin/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/recipe-library-macos-intel.app.zip
          cp "$dmg" artifacts/
          (cd artifacts && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-intel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    name: Windows x64 installer
    needs: [frontend, rust-sqlite-catalog]
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm run build
      - name: Rust and SQLite integration tests on Windows x64
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify installer and checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing' }
          New-Item -ItemType Directory -Path artifacts | Out-Null
          $installers | Copy-Item -Destination artifacts
          $lines = @(Get-ChildItem artifacts -File | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" })
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path artifacts) 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
